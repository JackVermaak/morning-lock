name: release

# Push a tag like v1.0 to build a debug APK and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "morning-lock-$GITHUB_REF_NAME-debug.apk"
          gh release create "$GITHUB_REF_NAME" "morning-lock-$GITHUB_REF_NAME-debug.apk" \
            --title "Morning Lock $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
